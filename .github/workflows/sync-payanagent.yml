name: Sync PayanAgent offers

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Create or update IntentFence marketplace offers
        env:
          PAYANAGENT_API_KEY: ${{ secrets.PAYANAGENT_API_KEY }}
          PAYANAGENT_DELIVERY_SECRET: ${{ secrets.PAYANAGENT_DELIVERY_SECRET }}
          PAYANAGENT_AGENT_ID: ${{ vars.PAYANAGENT_AGENT_ID }}
          PAYANAGENT_PRIMARY_OFFER_ID: ${{ vars.PAYANAGENT_OFFER_ID }}
          PAYANAGENT_QUOTE_OFFER_ID: ${{ vars.PAYANAGENT_QUOTE_OFFER_ID }}
          PAYANAGENT_OBSOLETE_OFFER_IDS: ${{ vars.PAYANAGENT_OBSOLETE_OFFER_IDS }}
        run: node scripts/sync-payanagent-offers.mjs
