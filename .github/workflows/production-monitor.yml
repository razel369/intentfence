name: Production activation path monitor

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: intentfence-production-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify production discovery, payment challenge, MCP, and metrics
        id: verify
        continue-on-error: true
        run: node scripts/monitor-production.mjs
      - name: Open one incident issue on failure
        if: steps.verify.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing="$(gh issue list --state open --search 'IntentFence production monitor failing in:title' --json number --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            gh issue create --title "IntentFence production monitor failing" --body "The scheduled production revenue-path monitor failed. Inspect this workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          else
            gh issue comment "$existing" --body "The monitor is still failing: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
          exit 1
      - name: Close recovered incident
        if: steps.verify.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Notification delivery must not turn a healthy production check red
          # when GitHub's Issues API is temporarily unavailable.
          existing="$(gh issue list --state open --search 'IntentFence production monitor failing in:title' --json number --jq '.[0].number // empty' 2>/dev/null || true)"
          if [ -n "$existing" ]; then
            gh issue close "$existing" --comment "Production revenue-path monitor recovered in $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
      - name: Notify the owner when a paid call settles
        if: steps.verify.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          METRICS_URL: https://agentpass-protocol.rmalka06.chatgpt.site/api/metrics
        run: |
          metrics="$(curl --fail --retry 3 --retry-delay 2 --silent --show-error "$METRICS_URL")"
          count="$(printf '%s' "$metrics" | jq -r '.settled_calls // 0')"
          revenue="$(printf '%s' "$metrics" | jq -r '.revenue_usdc // 0')"
          if [ "$count" -eq 0 ]; then
            echo "No settled paid calls yet."
            exit 0
          fi
          latest_body="$(gh api "repos/$GITHUB_REPOSITORY/issues?state=all&per_page=100" --jq '[.[] | select(.pull_request | not) | select(.title | startswith("IntentFence revenue received"))][0].body // ""')"
          previous="$(printf '%s' "$latest_body" | sed -n 's/.*<!-- settled-calls:\([0-9][0-9]*\) -->.*/\1/p')"
          previous="${previous:-0}"
          if [ "$count" -gt "$previous" ]; then
            gh label create revenue-notification --color 1D76DB --description "IntentFence received new settled revenue" --force
            body="$(printf 'IntentFence has recorded new settled x402 revenue. Aggregate production metrics: %s. No payer details are included in this public issue.\n\nSettled calls: %s\nRecorded revenue: %s USDC\n\n<!-- settled-calls:%s -->' "$METRICS_URL" "$count" "$revenue" "$count")"
            gh issue create \
              --title "IntentFence revenue received: $revenue USDC ($count settled calls)" \
              --label revenue-notification \
              --body "$body"
          fi
      - name: Notify the owner when a new lead is stored
        if: steps.verify.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          METRICS_URL: https://agentpass-protocol.rmalka06.chatgpt.site/api/metrics
        run: |
          count="$(curl --fail --retry 3 --retry-delay 2 --silent --show-error "$METRICS_URL" | jq -r '.leads_submitted // 0')"
          if [ "$count" -eq 0 ]; then
            echo "No private leads need follow-up."
            exit 0
          fi
          latest_body="$(gh api "repos/$GITHUB_REPOSITORY/issues?state=all&per_page=100" --jq '[.[] | select(.pull_request | not) | select(.title | startswith("IntentFence lead follow-up"))][0].body // ""')"
          previous="$(printf '%s' "$latest_body" | sed -n 's/.*<!-- lead-count:\([0-9][0-9]*\) -->.*/\1/p')"
          previous="${previous:-0}"
          if [ "$count" -gt "$previous" ]; then
            gh label create lead-notification --color 0E8A16 --description "A private IntentFence lead needs follow-up" --force
            body="$(printf 'IntentFence has stored a new private lead. No contact details are included in this public issue. Retrieve it through the authenticated admin endpoint, then close this issue after follow-up. Public aggregate metrics: %s\n\n<!-- lead-count:%s -->' "$METRICS_URL" "$count")"
            gh issue create \
              --title "IntentFence lead follow-up: $count total" \
              --label lead-notification \
              --body "$body"
          fi
