[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "intentfence"
version = "0.5.0"
description = "IntentFence spend-policy guard and signed-receipt client for AI agent runtimes."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "IntentFence" }]

[tool.hatch.build.targets.wheel]
packages = ["intentfence"]
